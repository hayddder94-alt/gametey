services:
  store:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PROD_SECURE: "true"
      SITE_URL: ${SITE_URL:-https://almuammal.iq}
      JWT_SECRET: ${JWT_SECRET:?err}
      ORDER_MAX_PER_HOUR: ${ORDER_MAX_PER_HOUR:-12}
    volumes:
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  db-data:
